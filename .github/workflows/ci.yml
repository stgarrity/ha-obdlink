name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      UV_EXCLUDE_NEWER: "2026-10-16T00:00:00Z"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: python -m pip install uv==0.8.22
      - run: uv sync --locked
      - run: uv run python -m unittest discover -s tests -v
      - run: uv run python -m compileall -q src custom_components
      - run: uv build
      - run: uv run python tools/build_release.py
